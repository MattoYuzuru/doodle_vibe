# Дополнение к doodle.service (кладётся в /etc/systemd/system/doodle.service.d/alert.conf).
# Если сервер падает 5 раз за 10 минут, systemd перестаёт его поднимать и сразу пишет владельцу (doodle-health-failed).
# Без ограничения Restart=always крутил бы падающий сервер вечно, и об этом никто бы не узнал.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5
OnFailure=doodle-health-failed.service
