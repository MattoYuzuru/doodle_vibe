name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform security and workflow fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run test:platform
      - name: Save platform fixture results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-fixtures-${{ github.run_attempt }}
          path: artifacts/platform/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Source and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm run check

  backend:
    name: Backend / ${{ matrix.suite }} fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: jarvis-app/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --prefix jarvis-app
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:${{ matrix.suite }}
      - name: Save synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.suite }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 7

  chromium:
    name: Backend Chromium runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - name: Resolve pinned playwright-core version
        id: playwright
        run: echo "version=$(node backend/node_modules/playwright-core/cli.js --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the pinned playwright-core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system libraries
        run: node backend/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Require the OS sandbox (no --no-sandbox fallback)
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run chromium:smoke --prefix backend

  web:
    name: Web build and browser fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            jarvis-app/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix jarvis-app/web
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-fixtures-${{ github.run_attempt }}
          path: |
            artifacts/e2e/
            artifacts/playwright-report/
          if-no-files-found: error
          retention-days: 7
